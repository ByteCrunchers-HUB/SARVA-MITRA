services:
  - type: web
    name: sarva-mitra-ml
    runtime: docker
    dockerfilePath: backend/ml_engine/Dockerfile
    dockerContext: backend/ml_engine
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SARVA_MODEL_PATH
        value: models/sarva_mitra_risk_model.joblib

  - type: web
    name: sarva-mitra-rag
    runtime: docker
    dockerfilePath: backend/rag_pipeline/Dockerfile
    dockerContext: backend/rag_pipeline
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGODB_DATABASE
        value: soil-rag-db
      - key: MONGODB_COLLECTION
        value: soil-rag-collection
      - key: MONGODB_VECTOR_INDEX
        value: rag_vector_index
      - key: RAG_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RAG_EMBEDDING_DIMENSION
        value: "384"
      - key: FASTEMBED_CACHE_PATH
        value: /app/.fastembed-cache
      - key: RAG_USE_VECTOR_SEARCH
        value: "true"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ML_ENGINE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
