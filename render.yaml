services:
  # ---------------------------------------------------------
  # 1. Interactive Streamlit Web UI
  # ---------------------------------------------------------
  - type: web
    name: sarva-mitra-ui
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SARVA_MODEL_PATH
        value: backend/ml_engine/models/sarva_mitra_risk_model.joblib
      - key: MONGODB_DATABASE
        value: soil-rag-db
      - key: MONGODB_COLLECTION
        value: soil-rag-collection
      - key: MONGODB_VECTOR_INDEX
        value: rag_vector_index
      - key: RAG_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: TOMORROW_IO_API_KEY
        sync: false
      - key: AGROMONITORING_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false

  # ---------------------------------------------------------
  # 2. Unified Backend API (FastAPI)
  # ---------------------------------------------------------
  - type: web
    name: sarva-mitra-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SARVA_MODEL_PATH
        value: backend/ml_engine/models/sarva_mitra_risk_model.joblib
      - key: MONGODB_DATABASE
        value: soil-rag-db
      - key: MONGODB_COLLECTION
        value: soil-rag-collection
      - key: MONGODB_VECTOR_INDEX
        value: rag_vector_index
      - key: RAG_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: TOMORROW_IO_API_KEY
        sync: false
      - key: AGROMONITORING_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
